<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame-driven loop study</title><style>body{margin:40px auto;max-width:800px;padding:0 24px;font:18px/1.5 system-ui;background:#fff;color:#000}h1{font-size:48px;line-height:1}svg{width:100%;border:2px solid}input{width:100%}output{font-variant-numeric:tabular-nums}</style><h1>One wave. Shared motion.</h1><p>Scrub the frame. The striped field and circle use the same deterministic wave; the heading stays still.</p><svg viewBox="0 0 800 350" role="img" aria-label="Neutral striped field and circle moving with a shared wave"><g id="lines" fill="none" stroke="black" stroke-width="10"></g><circle id="circle" cx="580" cy="175" r="38" fill="white" stroke="black" stroke-width="8"/></svg><label for="frame">Frame</label><input id="frame" type="range" min="0" max="360" value="0"><output id="readout"></output><script type="module">import{loopPhase,loopWave}from'./loop.mjs';const lines=document.querySelector('#lines'),circle=document.querySelector('#circle'),slider=document.querySelector('#frame'),readout=document.querySelector('#readout');function draw(){const frame=Number(slider.value),wave=loopWave(loopPhase(frame,30,12));lines.replaceChildren();for(let x=-40;x<850;x+=28){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',`M ${x} 0 C ${x+60+wave*30} 100 ${x-60+wave*30} 250 ${x} 350`);lines.append(path)}circle.setAttribute('cx',580+wave*20);circle.setAttribute('cy',175+wave*8);readout.textContent=`Frame ${frame} / 360 · wave ${wave.toFixed(3)}`;}slider.addEventListener('input',draw);draw();</script></html>
